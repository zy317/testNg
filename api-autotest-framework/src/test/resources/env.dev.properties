# ===========================================
# API 自动化测试框架 - 开发环境配置
# ===========================================

# ---- HTTP 配置 ----
HOST=http://dev-api.example.com
RPC_TIMEOUT=30000
SWIMLANE=dev-lane-001

# ---- SSO/MWS 认证配置 ----
CLIENT_ID=your_dev_client_id
CLIENT_SECRET=your_dev_client_secret
SSO_HOST=http://dev-sso.example.com

# ---- 默认测试账号 ----
DEFAULT_MIS=testuser001
DEFAULT_PASSWORD=test123456

# ---- 数据库配置 ----
# 示例：PERSONA 库
DB_PERSONA_URL=jdbc:mysql://dev-db.example.com:3306/persona?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
DB_PERSONA_USER=dev_user
DB_PERSONA_PASSWORD=dev_password

# ---- 通用配置 ----
TOKEN_EXPIRE_BUFFER=300000
