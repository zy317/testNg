# ===========================================
# API 自动化测试框架 - 预发环境配置
# ===========================================

# ---- HTTP 配置 ----
HOST=http://staging-api.example.com
RPC_TIMEOUT=30000
SWIMLANE=staging-lane-001

# ---- SSO/MWS 认证配置 ----
CLIENT_ID=your_staging_client_id
CLIENT_SECRET=your_staging_client_secret
SSO_HOST=http://staging-sso.example.com

# ---- 默认测试账号 ----
DEFAULT_MIS=testuser001
DEFAULT_PASSWORD=test123456

# ---- 数据库配置 ----
DB_PERSONA_URL=jdbc:mysql://staging-db.example.com:3306/persona?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
DB_PERSONA_USER=staging_user
DB_PERSONA_PASSWORD=staging_password

# ---- 通用配置 ----
TOKEN_EXPIRE_BUFFER=300000
